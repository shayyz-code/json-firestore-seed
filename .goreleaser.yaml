# .goreleaser.yaml
version: 2

project_name: json-firestore-seed

before:
  hooks:
    - cargo --version

builds:
  - id: json-firestore-seed
    builder: rust
    binary: json-firestore-seed
    command: zigbuild
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-gnu

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: json-firestore-seed
    # NOTE: To push to a separate repository (tap), you must use a GitHub 
    # Personal Access Token (PAT) with `repo` scope instead of the default GITHUB_TOKEN.
    repository:
      owner: shayyz-code
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/shayyz-code/json-firestore-seed"
    description: "Seed Firestore with JSON data easily."
    license: "MIT"
    install: |
      bin.install "json-firestore-seed"
    test: |
      system "#{bin}/json-firestore-seed --version"
