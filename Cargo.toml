[package]
name = "raccoon-firestore-entry"
version = "0.1.0"
edition = "2024"
authors = ["Aung Min Khant <aungminkhant.shay@gmail.com>", "RustRaccoon <dev@rustraccoon.com>"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
firestore = { version = "0.47" }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0"
colored = "3"
indicatif = "0.18.2"
